<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>fx-991CE X Emulator</title>
  <link rel="stylesheet" href="styles/faceplate.css">
  <link rel="stylesheet" href="styles/lcd.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="stage">
    <div id="calc" class="calc" aria-label="fx-991CE X calculator">
      <div class="logo">CASIO</div>
      <div class="model">fx-991CE X</div>
      <div class="series">CLASSWIZ</div>
      <div class="solar"></div>
      <div class="bezel"></div>
      <div class="glass">
        <div class="lcd" id="lcd" role="img" aria-live="polite">
          <canvas id="lcd-canvas" width="1152" height="450" hidden></canvas>
          <div class="status" id="status"></div>
          <div class="screen" id="screen"></div>
        </div>
      </div>
      <div class="keypad" id="keypad"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
</body>
</html>
